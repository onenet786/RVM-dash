<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <EMBED id="pluginIdTFPU" TYPE="application/x-asc-plugin" ALIGN=CENTER WIDTH=0 HEIGHT=0 speed=10 autostart=true
        loop=true name="ps">

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>popbox</title>
    <style>
        html {
            color: #000;
            background: #fff
        }

        body,
        div,
        dl,
        dt,
        dd,
        ul,
        ol,
        li,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        pre,
        code,
        form,
        fieldset,
        legend,
        input,
        button,
        textarea,
        select,
        p,
        blockquote,
        th,
        td {
            margin: 0;
            padding: 0;
        }

        table {
            border-collapse: collapse;
            border-spacing: 0
        }

        fieldset,
        img {
            border: 0
        }

        address,
        button,
        caption,
        cite,
        code,
        dfn,
        em,
        input,
        optgroup,
        option,
        select,
        strong,
        textarea,
        th,
        var {
            font: inherit
        }

        del,
        ins {
            text-decoration: none
        }

        li {
            list-style: none
        }

        caption,
        th {
            text-align: left
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-size: 100%;
            font-weight: normal
        }

        q:before,
        q:after {
            content: ''
        }

        abbr,
        acronym {
            border: 0;
            font-variant: normal
        }

        sup {
            vertical-align: baseline
        }

        sub {
            vertical-align: baseline
        }

        legend {
            color: #000
        }

        a {
            color: #0000ff;
        }

        /***********/
        .SafeBg {
            width: 340px;
            height: 170px;
            display: block;
            background: url(img/bg.png) 0 0 no-repeat;
            overflow: hidden;
        }

        .RiskBg {
            width: 340px;
            height: 170px;
            display: block;
            background: url(img/bg.png) 0 0 no-repeat;
        }

        #popbox .mbody {
            height: 96px;
            display: inline-block;
            width: 100%
        }

        #popbox .mbody dl {
            width: 100%;
            display: inline-block;
            margin: 0;
        }

        #popbox .mbody dl dt {
            float: left;
            width: 33px;
            margin-top: 10px;
            margin-left: 26px;
            height: 33px
        }

        #popbox .SafeSpan {
            color: #009933;
            font-size: 16px;
            font-weight: bold;
            margin-right: 10px;
            margin-top: 15px;
        }

        #popbox .SafeDes {
            float: left;
            color: #009933;
            font-size: 16px;
            font-weight: bold;
            margin-top: 12px;
        }

        #popbox .RiskDes {
            float: left;
            color: #d70101;
            font-size: 16px;
            font-weight: bold;
            margin-top: 12px;
        }


        #popbox .mbody dl dd.message {
            margin-bottom: 5px;
            line-height: 24px;
            height: 50px;
            width: 200px;
            overflow: hidden;
        }

        #popbox .head {
            height: 44px;
            width: 100%
        }

        /* .closebtn{width:18px; height:18px; display:block; cursor:pointer; float:right; margin-top:10px; margin-right:10px; background:url(PopupImg/popbox_btn_close.png) 0 0 no-repeat;} */
        .boxbtn_ok {
            width: 111px;
            height: 32px;
            display: block;
            float: right;
            margin-right: 108px;
            margin-top: 20px;
            background: url(./img/popbox_btn_ok.png);
            line-height: 28px;
            text-align: center;
            color: #000;
            text-decoration: none;
        }

        .bottom_info {
            margin: 0 4px;
            color: #666;
            font-size: 10px;
            height: 26px;
            line-height: 26px;
            position: absolute;
            bottom: 0;
        }

        .bottom_info li {
            float: left;
        }

        .bottom_info li.detai_info {
            text-align: center;
            width: 90px;
            text-decoration: underline;
            cursor: pointer;
            position: relative;
        }

        .bottom_info li.detai_info span {
            width: 82px;
            height: 64px;
            padding-top: 5px;
            display: none;
            background: url(PopupImg/tip_details.png) 0 0 no-repeat;
            position: absolute;
            top: -55px;
            right: 5px;
        }

        .bottom_info li.detai_info span a {
            text-align: center;
            line-height: 18px;
        }

        .bottom_info li.detai_info:hover span {
            display: inline-block;
        }

        .closebtn {
            width: 18px;
            height: 18px;
            display: block;
            cursor: pointer;
            float: right;
            margin-top: 1px;
            margin-right: 0px;
            background: url(PopupImg/popbox_btn_close.png) 0 0 no-repeat;
        }
    </style>
    </EMBED>
    <script type="text/javascript" src="panel_js.js"></script>
</head>

<body>
    <div id="popbox" class="SafeBg">
        <!--<div class="head"><a href="./PopupImg/popbox_btn_close.png" id="btnClose" class="closebtn" onclick="window.close();"></a></div> -->
        <div class="head"></div>
        <div class="mbody">
            <dl class="safe">
                <dt><img id="safeImg" src="./img/safe_logo.png" align="" style="margin:0;padding: 0" /></dt>
                <dd class=" RiskSpan" id="dd_detail"
                    style="margin-top: 17px; float: left; margin-left: 14px; width: 250px">
                    <!-- <span id="safeTitle" style="font-size:18px;color:#4cba71;">safe:</span> -->
                    <span id="safeDesc"
                        style="font-size: 17px; color: #4c4c4c; width: 242px;float: left;display: block">This site is
                        safe</span><br />
                    <span id="adsremovenum" style="font-size: 14px;color:#4cba71; visibility: hidden;"></span><span
                        id="adsremoved"
                        style="margin-top: 10px;font-size: 14px; color: #4cba71; width: 245px;visibility: hidden; "> ads
                        removed on this page </span><br />
                </dd>
            </dl>
            <div class="ADbWhite" style="position: absolute;padding-left: 2%;bottom: 5px; display: none;">
                <input type="checkbox" id="Adwhite" name="Adwhite" style="vertical-align: middle;">
                <label for="Adwhite" style="vertical-align: middle;">Allow ads on this site (refresh required)</label>
            </div>
        </div>
    </div>

</body>

<script src="popup.js"></script>

</html>
