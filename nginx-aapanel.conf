# =================================================================
# aaPanel / Ubuntu Dedicated Server Nginx Reverse Proxy Config
# Add this block inside aaPanel Website Configuration -> Nginx Config
# Domain: rvm.yourdomain.com (replace with your domain/subdomain)
# =================================================================

server {
    listen 80;
    listen [::]:80;
    server_name rvm.yourdomain.com; # Replace with your domain

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rvm.yourdomain.com; # Replace with your domain

    # aaPanel SSL Certificate Paths (Auto-generated by aaPanel Let's Encrypt)
    ssl_certificate /www/server/panel/vhost/cert/rvm.yourdomain.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/rvm.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Project Root Directory
    root /www/wwwroot/rvm.yourdomain.com/dist;
    index index.html;

    # Increase upload limit for database restoration JSON files (50MB)
    client_max_body_size 50M;

    # 1. Reverse Proxy API Requests to PM2 Express Backend (Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # 2. Static Assets Caching (JS, CSS, Images)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 3. Single Page Application (SPA) Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Access & Error Logs
    access_log /www/wwwlogs/rvm.yourdomain.com.log;
    error_log /www/wwwlogs/rvm.yourdomain.com.error.log;
}
